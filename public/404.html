<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WarQ — Digital Warranty</title>
  </head>
  <body>
    <p>Opening WarQ…</p>
    <script>
      (function () {
        var base = "/warq-demo/";
        var path = window.location.pathname || "/";
        if (path.indexOf(base) === 0) {
          path = path.slice(base.length);
        } else {
          path = path.replace(/^\/+/, "");
        }
        var target =
          window.location.origin + base + "#/" + path + (window.location.search || "");
        window.location.replace(target);
      })();
    </script>
  </body>
</html>
